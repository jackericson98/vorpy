[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=vorpy --cov-report=term-missing"

[tool.setuptools.package-data]
vorpy = [
    "data/*.pdb",
    "data/*.gro",
    "data/*.txt",
    "src/GUI/Images/*.png",
    "src/GUI/Images/*.ico",
]


[project]
name = "vorpy3"
version = "3.5.2"
description = "A Python package for Voronoi analysis of molecular structures"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "John Ericson", email = "jackericson98@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "numba",
  "shapely",
  "Pillow"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11"
]

[project.urls]
Homepage = "https://github.com/jackericson98/vorpy"

[project.optional-dependencies]
gui = ["pystray"]
dev = ["pytest", "pytest-cov", "black", "flake8", "mypy", "hypothesis"]

[project.scripts]
vorpy = "vorpy.__main__:main"
