[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=vorpy --cov-report=term-missing"

[tool.setuptools.package-data]
vorpy = [
    "data/*.pdb",
    "data/2KAI_Frames/*.pdb",
    "data/*.gro",
    "data/*.txt",
    "src/**/*.py",
    "src/GUI/Images/*.png",
    "src/GUI/Images/*.ico",
    "workbench/assets/*.png",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["vorpy*"]
exclude = ["vorpy.tests*"]


[project]
name = "vorpy3"
version = "3.5.2"
description = "A Python package for Voronoi analysis of molecular structures"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "John Ericson", email = "jackericson98@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.9",
  "pandas>=1.2",
  "numba==0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numba; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "shapely>=2.0",
  "Pillow"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11"
]

[project.urls]
Homepage = "https://github.com/jackericson98/vorpy"

[project.optional-dependencies]
gui = ["PySide6>=6.7", "pyvista>=0.44", "pyvistaqt>=0.11"]
gudhi = ["gudhi"]
dev = ["pytest", "pytest-cov", "pytest-timeout", "numba", "black", "flake8", "mypy", "hypothesis", "ruff>=0.6"]

[project.scripts]
vorpy = "vorpy.__main__:main"
